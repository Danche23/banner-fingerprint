version: "3.9"

services:
  server:
    build:
      context: .
      target: server
    container_name: banner-server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      RULES_PATH: "./rules/fingerprints.json"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: .
      target: client
    container_name: banner-client
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: "http://server:8080"
    volumes:
      - ./data:/data:ro
    command: ["-data", "/data/input.json", "-server", "http://server:8080"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
